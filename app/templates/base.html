<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ZWOL Sync - Silvasoft & HubSpot{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="brand-logo">🔄</span>
        <div>
          <span class="brand-title">ZWOL Sync</span>
          <span class="brand-subtitle">Silvasoft ⟷ HubSpot CRM Synchronisatie</span>
        </div>
      </div>

      <nav class="nav-links">
        <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">📊 Overzicht & Diffs</a>
        <a href="/queue" class="nav-item {% if request.path == '/queue' %}active{% endif %}">
          ⏳ Wachtrij
          <span id="nav-queue-badge" class="badge badge-pill badge-primary" style="display:none;">0</span>
        </a>
        <a href="/history" class="nav-item {% if request.path == '/history' %}active{% endif %}">📜 Geschiedenis</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-secondary btn-sm" onclick="triggerSync('silvasoft')" title="Silvasoft cache verversen">
          <span>🔄 Silvasoft</span>
        </button>
        <button class="btn btn-secondary btn-sm" onclick="triggerSync('hubspot')" title="HubSpot cache verversen">
          <span>🔄 HubSpot</span>
        </button>
        <button class="btn btn-primary btn-sm" onclick="triggerSync('all')" title="Beide systemen verversen en matchen">
          <span>⚡ Alles Verversen</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
