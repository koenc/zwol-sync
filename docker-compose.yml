services:
  zwol-sync:
    build: .
    container_name: zwol-sync
    restart: always
    ports:
      - "8505:8505"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Europe/Amsterdam
    extra_hosts:
      - "host.docker.internal:host-gateway"

